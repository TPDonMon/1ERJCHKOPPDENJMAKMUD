<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Montserrat:wght@400;700&family=Poppins:wght@400;700&family=Lato:wght@400;700&family=Nunito:wght@400;700&family=Raleway:wght@400;700&family=Work+Sans:wght@400;700&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&family=Lora:wght@400;700&family=Crimson+Text:wght@400;700&family=EB+Garamond:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=Libre+Baskerville:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;700&family=Source+Code+Pro:wght@400;700&family=Space+Mono:wght@400;700&family=Courier+Prime:wght@400;700&family=Oswald:wght@400;700&family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&family=Bebas+Neue&family=Abril+Fatface&family=Lobster&family=Pacifico&family=Shadows+Into+Light&family=Indie+Flower&family=Permanent+Marker&family=Satisfy&display=swap">
<style>
  :root{
    --bg:#0a0b0f; --panel:#11131a; --panel2:#171a23; --line:#232736;
    --text:#e7e9f0; --muted:#7d8398; --accent:#8b7cf6; --accent2:#5b8def;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 80% -10%,rgba(139,124,246,.12),transparent 60%),var(--bg);
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;height:100vh;overflow:hidden;
  }
  ::selection{background:rgba(139,124,246,.35)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#2a2f42;border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  body.drag::after{
    content:"Drop to import";position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:18px;
    background:rgba(10,11,15,.85);display:grid;place-items:center;font-size:22px;font-weight:600;
    color:#c9c1ff;z-index:100;pointer-events:none;
  }

  /* Sidebar */
  aside{
    width:300px;min-width:300px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;
  }
  .brand{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 12px}
  .brand h1{font-size:18px;font-weight:650;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:14px;color:#fff;box-shadow:0 4px 16px rgba(139,124,246,.4)}
  .new-btn{
    border:0;cursor:pointer;color:#fff;font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));transition:.2s;
  }
  .new-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(139,124,246,.35)}
  .actions{display:flex;gap:6px;margin:0 16px 10px}
  .ghost{
    flex:1;border:1px solid var(--line);background:var(--panel2);color:#b6bbcc;font-size:12px;font-weight:550;
    padding:8px 6px;border-radius:9px;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap;
  }
  .ghost:hover{border-color:var(--accent);color:#fff;background:rgba(139,124,246,.12)}
  .search{margin:0 16px 12px}
  .search input{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:10px;font-size:13px;outline:none;transition:.2s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,124,246,.15)}
  #list{flex:1;overflow-y:auto;padding:0 10px 14px}
  .card{
    padding:12px 12px;border-radius:var(--radius);cursor:pointer;margin-bottom:4px;
    border:1px solid transparent;transition:.15s;position:relative;
  }
  .card:hover{background:var(--panel2)}
  .card.active{background:var(--panel2);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
  .card h3{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:46px}
  .card p{font-size:12px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
  .card time{font-size:11px;color:#575c70;margin-top:6px;display:block}
  .del{
    position:absolute;top:8px;right:8px;border:0;background:transparent;color:var(--muted);
    font-size:11px;padding:4px 7px;border-radius:6px;cursor:pointer;opacity:0;transition:.15s;
  }
  .card:hover .del{opacity:1}
  .del:hover{background:rgba(255,90,100,.15);color:#ff7a85}
  .del.confirm{opacity:1;background:rgba(255,90,100,.2);color:#ff7a85}
  .empty-list{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px}

  /* Main */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:10px 18px;
    background:rgba(17,19,26,.8);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  }
  .group{display:flex;align-items:center;gap:2px;padding-right:8px;margin-right:4px;border-right:1px solid var(--line)}
  .group:last-child{border:0}
  .tb{
    min-width:32px;height:32px;border:0;background:transparent;color:#b6bbcc;border-radius:8px;
    cursor:pointer;font-size:14px;display:grid;place-items:center;transition:.15s;padding:0 8px;font-family:inherit;
  }
  .tb:hover{background:var(--panel2);color:#fff}
  .tb.on{background:rgba(139,124,246,.22);color:#c9c1ff}
  select.tb{appearance:none;padding:0 10px;background:var(--panel2);border:1px solid var(--line);font-size:13px;outline:none}
  select.tb option{background:var(--panel)}
  .color{position:relative;overflow:hidden}
  .color input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .color span{pointer-events:none;font-weight:700;border-bottom:3px solid var(--c,#fff);line-height:1.1}

  .doc{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:36px 28px 60px}
  .page{width:100%;max-width:780px}
  #title{
    width:100%;background:transparent;border:0;outline:0;color:#fff;
    font-size:38px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px;font-family:inherit;
  }
  #title::placeholder{color:#3a3f54}
  .meta{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-bottom:22px;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;margin-right:6px;transition:.2s}
  .dot.saving{background:#fbbf24}

  #editor{outline:none;min-height:55vh;caret-color:var(--accent)}
  #editor.is-empty::before{content:attr(data-ph);color:#41465c;pointer-events:none;position:absolute}

  /* Shared rich-text look (live editor AND exported image) */
  .rich{font-size:16.5px;line-height:1.75;color:#d6d9e6;word-wrap:break-word}
  .rich h1{font-size:1.82em;margin:.8em 0 .3em;letter-spacing:-.02em;color:#fff}
  .rich h2{font-size:1.39em;margin:.8em 0 .3em;letter-spacing:-.01em;color:#fff}
  .rich h3{font-size:1.09em;margin:.8em 0 .3em;color:#fff}
  .rich strong,.rich b{color:#fff;font-weight:700}
  .rich ul,.rich ol{margin:.5em 0 .5em 1.5em}
  .rich li{margin:.15em 0}
  .rich li::marker{color:var(--accent)}
  .rich blockquote{border-left:3px solid var(--accent);padding:.3em 0 .3em 16px;margin:.8em 0;color:#9ca2b8;font-style:italic;background:linear-gradient(90deg,rgba(139,124,246,.07),transparent)}
  .rich code{background:var(--panel2);border:1px solid var(--line);padding:2px 6px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;color:#f0abfc}
  .rich a{color:var(--accent2);text-decoration:underline;text-underline-offset:3px}
  .rich hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}
  .rich font[size="2"]{font-size:.79em}
  .rich font[size="3"]{font-size:1em}
  .rich font[size="4"]{font-size:1.21em}
  .rich font[size="5"]{font-size:1.58em}
  .rich font[size="6"]{font-size:2.06em}


  /* Media, size controls, read-only */
  .rich figure.media{margin:1em 0;border-radius:12px;max-width:100%}
  .rich figure.img img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
  .rich figure[data-align=center]{margin-left:auto;margin-right:auto}
  .rich figure.aud{background:var(--panel2);border:1px solid var(--line);padding:12px 14px}
  .rich figure.aud::before{content:"\1F3B5  " attr(data-name);display:block;font-size:.85em;color:#b6bbcc;margin-bottom:8px;font-family:Inter,sans-serif}
  .rich figure.aud audio{width:100%;height:36px}
  #mediaFrame{position:fixed;border:2px solid var(--accent);border-radius:12px;pointer-events:none;z-index:40}
  #mediaBar{position:fixed;z-index:50;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #mediaBar .tb{height:28px;min-width:28px;font-size:12px}
  .lbl{font-size:11px;color:var(--muted);margin:0 6px 0 4px}
  input[type=range]{width:90px;accent-color:var(--accent)}
  #baseVal{font-size:12px;color:#b6bbcc;min-width:34px;margin-left:6px}
  #selSize{width:54px;height:32px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;text-align:center;font-size:13px;outline:none}
  .tb.ro{font-weight:600}
  body.ro .toolbar .group:not(.keep){display:none}
  body.ro #editor{caret-color:transparent}
  body.ro #title{pointer-events:none}
  #roBadge{color:#fbbf24}

  /* Off-screen export stage */
  .stage{
    position:absolute;left:-10000px;top:0;width:900px;padding:56px 64px 52px;
    background:radial-gradient(900px 420px at 85% -12%,rgba(139,124,246,.16),transparent 60%),#0a0b0f;
    color:var(--text);
  }
  .stage .x-title{font-size:38px;font-weight:700;letter-spacing:-.03em;color:#fff;margin-bottom:8px;line-height:1.2}
  .stage .x-title.empty{color:#3a3f54}
  .stage .meta{margin-bottom:22px}

  .none{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center}
  .hide{display:none!important}

  #toast{
    position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#1c1f2b;color:#e7e9f0;
    border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;
    transition:.25s;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:760px){
    body{flex-direction:column;height:auto;min-height:100vh;overflow:auto}
    aside{width:100%;min-width:0;max-height:300px}
    .doc{padding:24px 16px}
    #title{font-size:28px}
  }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <h1><span class="logo">✦</span>Notes</h1>
    <button class="new-btn" id="newBtn">+ New</button>
  </div>
  <div class="actions">
    <button class="ghost" id="importBtn" title="Import PNG, JSON, TXT or MD files (or drop them anywhere)">⬆ Import</button>
    <button class="ghost" id="exportBtn" title="Export this note as a PNG image">⬇ Export PNG</button>
    <button class="ghost" id="backupBtn" title="Download all notes as JSON">Backup</button>
  </div>
  <input type="file" id="file" accept=".png,.json,.txt,.md,.markdown,image/*,audio/*,application/json,text/plain" multiple hidden>
  <div class="search"><input id="search" placeholder="Search notes…" autocomplete="off"></div>
  <div id="list"></div>
</aside>

<main id="main">
  <div class="toolbar" id="toolbar">
    <div class="group keep">
      <button class="tb ro" id="roBtn" title="Toggle read-only mode">🔓 Editing</button>
    </div>
    <div class="group keep">
      <span class="lbl">Note size</span><input type="range" id="baseSize" min="12" max="36" step="0.5" value="16.5" title="Text size for the whole note"><span id="baseVal">16.5</span>
    </div>
    <div class="group">
      <span class="lbl">Selection / word</span>
      <button class="tb" id="szDown" title="Smaller (selection, or word at cursor)">A−</button>
      <input type="number" id="selSize" min="6" max="200" step="0.5" value="16.5" title="Size in px for selected text, or the word at the cursor">
      <button class="tb" id="szUp" title="Larger (selection, or word at cursor)">A+</button>
    </div>
    <div class="group">
      <button class="tb" data-cmd="undo" title="Undo">↶</button>
      <button class="tb" data-cmd="redo" title="Redo">↷</button>
    </div>
    <div class="group">
      <select class="tb" id="block" title="Paragraph style">
        <option value="P">Paragraph</option>
        <option value="H1">Heading 1</option>
        <option value="H2">Heading 2</option>
        <option value="H3">Heading 3</option>
      </select>
      <select class="tb" id="font" title="Font"></select>
    </div>
    <div class="group">
      <button class="tb" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="tb" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="tb" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
      <button class="tb" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
    </div>
    <div class="group">
      <label class="tb color" title="Text color"><span id="fcSpan" style="--c:#8b7cf6">A</span><input type="color" id="fc" value="#8b7cf6"></label>
      <label class="tb color" title="Highlight"><span id="hcSpan" style="--c:#fbbf24">▮</span><input type="color" id="hc" value="#fbbf24"></label>
    </div>
    <div class="group">
      <button class="tb" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
      <button class="tb" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
      <button class="tb" data-cmd="outdent" title="Outdent">⇤</button>
      <button class="tb" data-cmd="indent" title="Indent">⇥</button>
    </div>
    <div class="group">
      <button class="tb" data-cmd="justifyLeft" title="Align left">⯇</button>
      <button class="tb" data-cmd="justifyCenter" title="Center">≡</button>
      <button class="tb" data-cmd="justifyRight" title="Align right">⯈</button>
    </div>
    <div class="group">
      <button class="tb" id="photoBtn" title="Insert photo">🖼 Photo</button>
      <button class="tb" id="audioBtn" title="Insert MP3 / audio">🎵 Audio</button>
    </div>
    <div class="group">
      <button class="tb" id="quote" title="Quote">❝</button>
      <button class="tb" id="link" title="Insert link">🔗</button>
      <button class="tb" data-cmd="insertHorizontalRule" title="Divider">―</button>
      <button class="tb" data-cmd="removeFormat" title="Clear formatting">Tx</button>
    </div>
  </div>

  <div class="doc" id="doc">
    <div class="page">
      <input id="title" placeholder="Untitled note" autocomplete="off" spellcheck="false">
      <div class="meta">
        <span id="date"></span>
        <span id="count">0 words</span>
        <span id="roBadge" class="hide">🔒 Read only</span>
        <span><i class="dot" id="dot"></i><span id="status">Saved</span></span>
      </div>
      <div id="editor" class="rich" contenteditable="true" spellcheck="true" data-ph="Start writing… try **bold**, *italic* or ***both***"></div>
    </div>
  </div>
  <div class="none hide" id="none"><div><p style="font-size:42px;margin-bottom:10px">✦</p><p>No note selected.</p><p style="margin-top:6px;font-size:13px">Create one or import a file to get started.</p></div></div>
</main>

<input type="file" id="photoFile" accept="image/*" multiple hidden>
<input type="file" id="audioFile" accept="audio/*,.mp3" multiple hidden>
<div id="mediaFrame" class="hide"></div>
<div id="mediaBar" class="hide"><button class="tb" data-w="25">25%</button><button class="tb" data-w="50">50%</button><button class="tb" data-w="75">75%</button><button class="tb" data-w="100">100%</button><button class="tb" data-al="left" title="Align left">⯇</button><button class="tb" data-al="center" title="Center">≡</button><button class="tb" id="mediaDel" title="Remove">✕</button></div>
<div id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const editor = $('#editor'), titleEl = $('#title'), listEl = $('#list');
  let notes = [], currentId = null, saveTimer = null, query = '', pendingDelete = null, toastTimer = null;

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const clean = s => (s || '').replace(/\u200B/g, '');
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const fmtDate = t => new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + ' · ' +
                       new Date(t).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  const plain = html => { const d = document.createElement('div'); d.innerHTML = html.replace(/<(img|audio)\b[^>]*>/gi, ''); return clean(d.innerText || d.textContent || '').trim(); };
  const current = () => notes.find(n => n.id === currentId);
  let readOnly = false, lastRange = null, selMedia = null;
  const DEFAULT_SIZE = 16.5;

  /* Storage: window.storage when available, otherwise IndexedDB */
  const hasWS = typeof window.storage?.get === 'function';
  const MEDIA_LIMIT = hasWS ? 3.5e6 : 30e6;
  const store = (() => {
    let dbp;
    const idb = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('notes-app', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
    const tx = async (mode, fn) => { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('kv', mode); const q = fn(t.objectStore('kv')); t.oncomplete = () => res(q.result); t.onerror = t.onabort = () => rej(t.error); }); };
    return {
      async get(k) { if (hasWS) { const r = await window.storage.get(k); return r && r.value ? r.value : null; } return (await tx('readonly', o => o.get(k))) ?? null; },
      async set(k, v) { if (hasWS) { if (!(await window.storage.set(k, v))) throw new Error('fail'); return; } await tx('readwrite', o => o.put(v, k)); }
    };
  })();

  /* Fonts */
  const FONTS = [
    ['System', [['Sans (Inter)', 'Inter, sans-serif'], ['Arial', 'Arial, sans-serif'], ['Georgia', 'Georgia, serif'], ['Times New Roman', "'Times New Roman', serif"], ['Comic Sans', "'Comic Sans MS', cursive"], ['Mono', 'ui-monospace, Menlo, monospace']]],
    ['Sans-serif', ['Roboto', 'Open Sans', 'Montserrat', 'Poppins', 'Lato', 'Nunito', 'Raleway', 'Work Sans'].map(f => [f, `'${f}', sans-serif`])],
    ['Serif', ['Playfair Display', 'Merriweather', 'Lora', 'Crimson Text', 'EB Garamond', 'Cormorant Garamond', 'Libre Baskerville'].map(f => [f, `'${f}', serif`])],
    ['Monospace', ['JetBrains Mono', 'Fira Code', 'Source Code Pro', 'Space Mono', 'Courier Prime'].map(f => [f, `'${f}', monospace`])],
    ['Display', ['Bebas Neue', 'Oswald', 'Abril Fatface', 'Lobster', 'Pacifico'].map(f => [f, `'${f}', sans-serif`])],
    ['Handwriting', ['Caveat', 'Dancing Script', 'Shadows Into Light', 'Indie Flower', 'Permanent Marker', 'Satisfy'].map(f => [f, `'${f}', cursive`])]
  ];
  FONTS.forEach(([g, list]) => {
    const og = document.createElement('optgroup'); og.label = g;
    list.forEach(([label, stack]) => { const o = document.createElement('option'); o.value = stack; o.textContent = label; o.style.fontFamily = stack; og.appendChild(o); });
    $('#font').appendChild(og);
  });
  const fontKey = v => (v || '').split(',')[0].replace(/['"]/g, '').trim().toLowerCase();

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  /* ---------- Storage ---------- */
  async function load() {
    try {
      const v = await store.get('notes-v1');
      if (v) notes = JSON.parse(v);
    } catch (e) { /* no saved notes yet */ }
    if (!notes.length) notes = [makeNote('Welcome', welcomeHTML())];
    currentId = notes[0].id;
    renderList(); openNote(currentId);
  }
  function setStatus(saving) {
    $('#dot').classList.toggle('saving', saving);
    $('#status').textContent = saving ? 'Saving…' : 'Saved';
  }
  function scheduleSave() {
    setStatus(true);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      let ok = true;
      try { await store.set('notes-v1', JSON.stringify(notes)); } catch (e) { ok = false; toast('Could not save. Storage may be full; try removing some media.'); }
      setStatus(false); if (!ok) $('#status').textContent = 'Not saved';
    }, 500);
  }

  function welcomeHTML() {
    return '<p>Welcome! This editor formats as you type.</p>' +
      '<ul><li>Type <code>**text**</code> for <strong>bold</strong></li>' +
      '<li>Type <code>*text*</code> for <em>italic</em></li>' +
      '<li>Type <code>***text***</code> for <strong><em>both</em></strong></li>' +
      '<li>Type <code>~~text~~</code> for <s>strikethrough</s></li></ul>' +
      '<p>New: pick a <em>Note size</em>, resize any selected text or single word with <strong>A−/A+</strong>, add photos and MP3s, and lock a note with <strong>Read only</strong>.</p>' +

  }

  function makeNote(title = '', html = '') {

  }

  /* ---------- Sidebar ---------- */
  function renderList() {
    const q = query.toLowerCase();

      .filter(n => !q || n.title.toLowerCase().includes(q) || plain(n.html).toLowerCase().includes(q))
      .sort((a, b) => b.updated - a.updated);
    if (!shown.length) { listEl.innerHTML = '<div class="empty-list">No notes found</div>'; return; }
    listEl.innerHTML = '';
    shown.forEach(n => {
      const el = document.createElement('div');
      el.className = 'card' + (n.id === currentId ? ' active' : '');
      el.innerHTML = `<h3>${n.readOnly ? '🔒 ' : ''}${esc(n.title || 'Untitled note')}</h3><p>${esc(plain(n.html).slice(0, 120)) || 'Empty note'}</p><time>${fmtDate(n.updated)}</time>`;
      const del = document.createElement('button');
      del.className = 'del' + (pendingDelete === n.id ? ' confirm' : '');
      del.textContent = pendingDelete === n.id ? 'Sure?' : 'Delete';
      del.onclick = e => {
        e.stopPropagation();
        if (pendingDelete === n.id) { removeNote(n.id); }
        else { pendingDelete = n.id; renderList(); setTimeout(() => { if (pendingDelete === n.id) { pendingDelete = null; renderList(); } }, 2500); }
      };
      el.appendChild(del);
      el.onclick = () => { pendingDelete = null; openNote(n.id); renderList(); };
      listEl.appendChild(el);
    });
  }

  function removeNote(id) {
    notes = notes.filter(n => n.id !== id);

  }

  function openNote(id) {
    const n = notes.find(x => x.id === id);

  function wordStats(text) {
    const t = clean(text).trim();

  }

  function updateMeta() {

  }

  /* ---------- Auto-formatting ---------- */
  const inner = '([^*\\s](?:[^*]*[^*\\s])?)';
  const rules = [
    [new RegExp('(?<!\\*)\\*\\*\\*' + inner + '\\*\\*\\*$'), t => `<strong><em>${t}</em></strong>`],
    [new RegExp('(?<!\\*)\\*\\*' + inner + '\\*\\*$'),       t => `<strong>${t}</strong>`],
    [new RegExp('(?<!\\*)\\*' + inner + '\\*$'),             t => `<em>${t}</em>`],
    [/~~([^~\s](?:[^~]*[^~\s])?)~~$/,                        t => `<s>${t}</s>`],
    [/`([^`]+)`$/,                                           t => `<code>${t}</code>`],
  ];

  function autoFormat(e) {
    if (e.inputType !== 'insertText' || !e.data || !/[*~`]/.test(e.data)) return;
    const sel = getSelection();
    if (!sel.rangeCount || !sel.isCollapsed) return;
    const node = sel.anchorNode;
    if (!node || node.nodeType !== 3 || !editor.contains(node)) return;
    if (node.parentElement.closest('code')) return;
    const off = sel.anchorOffset;
    const before = node.textContent.slice(0, off);
    for (const [re, tpl] of rules) {
      const m = before.match(re);
      if (!m) continue;
      const r = document.createRange();
      r.setStart(node, off - m[0].length);
      r.setEnd(node, off);
      sel.removeAllRanges(); sel.addRange(r);
      document.execCommand('insertHTML', false, tpl(esc(m[1])) + '&#8203;');
      return;
    }
  }

  editor.addEventListener('input', e => { autoFormat(e); commit(); });

  // Convert markdown-style markers inside a line of text into HTML
  function inlineMd(s) {
    const codes = [];
    let h = esc(s).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    h = h
      .replace(/\*\*\*(?=\S)(.+?)(?<=\S)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*(?=\S)(.+?)(?<=\S)\*\*/g, '<strong>$1</strong>')
      .replace(/(?<![*\w])\*(?=\S)(.+?)(?<=\S)\*(?!\w)/g, '<em>$1</em>')
      .replace(/~~(?=\S)(.+?)(?<=\S)~~/g, '<s>$1</s>');
    return h.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[i] + '</code>');
  }

  // Pasted text gets the same auto-formatting as typed text

    const sel = getSelection();
    const anchor = sel.anchorNode && (sel.anchorNode.nodeType === 3 ? sel.anchorNode.parentElement : sel.anchorNode);
    if (anchor && anchor.closest && anchor.closest('code')) { // inside inline code: keep literal
      document.execCommand('insertText', false, text);
      return;
    }
    text.split('\n').forEach((line, i) => {
      if (i) document.execCommand('insertParagraph');
      if (!line) return;
      let html = inlineMd(line);

  function refreshState() {

  /* ---------- Sizes ---------- */
  function applyBase(px) {
    editor.style.fontSize = px + 'px';
    $('#baseSize').value = px; $('#baseVal').textContent = px + 'px';
  }
  $('#baseSize').oninput = e => {
    const px = +e.target.value; applyBase(px);
    const n = current(); if (n) { n.size = px; scheduleSave(); }
  };
  function sizeAt(r) {
    let n = r.startContainer;
    if (n.nodeType === 1) n = n.childNodes[r.startOffset] || n;
    if (n.nodeType === 3) n = n.parentElement;
    return parseFloat(getComputedStyle(n || editor).fontSize) || DEFAULT_SIZE;
  }
  function ensureSel() {
    const s = getSelection();
    if (!(s.rangeCount && editor.contains(s.anchorNode)) && lastRange) { s.removeAllRanges(); s.addRange(lastRange); }
    return s;
  }
  function expandToWord(sel) {
    const n = sel.anchorNode, o = sel.anchorOffset;
    if (!n || n.nodeType !== 3) return false;
    const t = n.textContent, ok = c => c && /[^\s\u200B]/.test(c);
    let a = o, b = o;
    while (a > 0 && ok(t[a - 1])) a--;
    while (b < t.length && ok(t[b])) b++;
    if (a === b) return false;
    const r = document.createRange(); r.setStart(n, a); r.setEnd(n, b); sel.removeAllRanges(); sel.addRange(r);
    return true;
  }
  function applySize(px) {
    if (readOnly) return;
    px = Math.min(200, Math.max(6, +px || DEFAULT_SIZE));
    editor.focus();
    const sel = ensureSel();
    if (!sel.rangeCount) return;
    if (sel.isCollapsed && !expandToWord(sel)) { toast('Select some text, or put the cursor in a word'); return; }
    document.execCommand('styleWithCSS', false, false);
    document.execCommand('fontSize', false, '7');
    const spans = [];
    editor.querySelectorAll('font[size="7"]').forEach(f => {
      const sp = document.createElement('span'); sp.style.fontSize = px + 'px';
      while (f.firstChild) sp.appendChild(f.firstChild);
      f.replaceWith(sp); spans.push(sp);
      sp.querySelectorAll('[style*="font-size"]').forEach(c => { c.style.fontSize = ''; if (!c.getAttribute('style')) c.removeAttribute('style'); });
      sp.querySelectorAll('font[size]').forEach(c => c.removeAttribute('size'));
    });
    if (spans.length) { const r = document.createRange(); r.setStartBefore(spans[0]); r.setEndAfter(spans[spans.length - 1]); sel.removeAllRanges(); sel.addRange(r); }
    $('#selSize').value = px;
    commit();
  }
  [['#szDown', -2], ['#szUp', 2]].forEach(([id, d]) => {
    $(id).addEventListener('mousedown', e => e.preventDefault());
    $(id).onclick = () => { const s = ensureSel(); if (!s.rangeCount) return; applySize(sizeAt(s.getRangeAt(0)) + d); };
  });
  $('#selSize').onchange = e => applySize(e.target.value);

  /* ---------- Read-only ---------- */
  function setReadOnly(v, persist = true) {
    readOnly = v;
    editor.contentEditable = v ? 'false' : 'true';
    titleEl.readOnly = v;
    document.body.classList.toggle('ro', v);
    $('#roBtn').textContent = v ? '🔒 Read only' : '🔓 Editing';
    $('#roBtn').classList.toggle('on', v);
    $('#roBadge').classList.toggle('hide', !v);

    if (persist) { const n = current(); if (n) { n.readOnly = v; scheduleSave(); renderList(); } toast(v ? 'Read-only mode on' : 'Editing enabled'); }
  }
  $('#roBtn').onclick = () => setReadOnly(!readOnly);

  /* ---------- Photos & audio ---------- */
  const readDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(f); });
  const attr = t => esc(t).replace(/"/g, '&quot;');
  async function imageData(f) {
    if (f.type === 'image/gif') { if (f.size > MEDIA_LIMIT) throw new Error('big'); return readDataURL(f); }
    const url = URL.createObjectURL(f);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('bad')); i.src = url; });
      const W = img.naturalWidth || 800, H = img.naturalHeight || 600, k = Math.min(1, 1600 / Math.max(W, H));
      const c = document.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(H * k);
      const x = c.getContext('2d'), jpg = f.type === 'image/jpeg';
      if (jpg) { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
      x.drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL(jpg ? 'image/jpeg' : 'image/webp', .88);
    } finally { URL.revokeObjectURL(url); }
  }
  function insertBlock(html) {
    editor.focus();
    const s = ensureSel();
    if (!s.rangeCount || !editor.contains(s.anchorNode)) { const r = document.createRange(); r.selectNodeContents(editor); r.collapse(false); s.removeAllRanges(); s.addRange(r); }
    document.execCommand('insertHTML', false, html + '<p><br></p>');
    commit();
  }
  async function insertMedia(f) {
    if (readOnly) { toast('This note is read-only'); return false; }
    try {
      if (f.type.startsWith('audio/') || /\.(mp3|m4a|wav|ogg|flac)$/i.test(f.name)) {
        if (f.size > MEDIA_LIMIT) { toast(`Audio too large (max ${Math.round(MEDIA_LIMIT / 1e6)} MB here)`); return false; }
        let d = await readDataURL(f);
        if (!/^data:audio\//.test(d)) d = d.replace(/^data:[^;,]*/, 'data:audio/mpeg');
        insertBlock(`<figure class="media aud" contenteditable="false" data-name="${attr(f.name.replace(/\.[^.]+$/, ''))}"><audio controls preload="metadata" src="${d}"></audio></figure>`);
      } else {
        const d = await imageData(f);
        insertBlock(`<figure class="media img" contenteditable="false"><img src="${d}" alt="" draggable="false"></figure>`);
      }
      return true;
    } catch (err) { console.error(err); toast('Could not add that file'); return false; }
  }
  [['#photoBtn', '#photoFile'], ['#audioBtn', '#audioFile']].forEach(([b, i]) => {
    $(b).addEventListener('mousedown', e => e.preventDefault());
    $(b).onclick = () => { if (readOnly) return toast('This note is read-only'); $(i).click(); };
    $(i).onchange = async e => { for (const f of [...e.target.files]) await insertMedia(f); e.target.value = ''; };
  });

  const bar = $('#mediaBar'), frame = $('#mediaFrame');
  function placeBar() {
    if (!selMedia || !selMedia.isConnected) return selectMedia(null);
    const r = selMedia.getBoundingClientRect();
    Object.assign(frame.style, { left: r.left - 3 + 'px', top: r.top - 3 + 'px', width: r.width + 6 + 'px', height: r.height + 6 + 'px' });
    bar.style.left = Math.max(8, r.right - bar.offsetWidth) + 'px';
    bar.style.top = Math.max(8, r.top - bar.offsetHeight - 8) + 'px';
  }
  function selectMedia(f) {
    selMedia = f;
    bar.classList.toggle('hide', !f); frame.classList.toggle('hide', !f);
    if (f) { bar.querySelectorAll('[data-w],[data-al]').forEach(b => b.classList.toggle('hide', f.classList.contains('aud'))); placeBar(); }
  }
  document.addEventListener('mousedown', e => {
    if (e.target.closest('#mediaBar')) return;

  window.addEventListener('resize', () => selMedia && placeBar());
  bar.addEventListener('mousedown', e => e.preventDefault());
  bar.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !selMedia) return;
    if (b.dataset.w) selMedia.style.width = b.dataset.w + '%';

    const imgs = [...((e.clipboardData && e.clipboardData.files) || [])].filter(f => f.type.startsWith('image/'));

  });

  /* =====================================================
     EXPORT / IMPORT
     ===================================================== */

  /* ---- PNG chunk helpers (embed note data inside the PNG) ---- */
  const crcTable = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(buf) { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = crcTable[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  function makeChunk(type, data) {
    const out = new Uint8Array(12 + data.length), dv = new DataView(out.buffer);
    dv.setUint32(0, data.length);
    for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
    out.set(data, 8);
    dv.setUint32(8 + data.length, crc32(out.subarray(4, 8 + data.length)));
    return out;
  }

  function toBase64(str) {
    const bytes = new TextEncoder().encode(str); let bin = '';
    for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    return btoa(bin);
  }
  function fromBase64(b64) {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function embedNoteData(png, payload) {
    const text = 'notedata\0' + toBase64(JSON.stringify(payload));
    const data = new Uint8Array(text.length);
    for (let i = 0; i < text.length; i++) data[i] = text.charCodeAt(i);
    const chunk = makeChunk('tEXt', data);
    // locate IEND
    let pos = 8; const dv = new DataView(png.buffer, png.byteOffset, png.byteLength);
    while (pos < png.length) {
      const len = dv.getUint32(pos), type = String.fromCharCode(...png.subarray(pos + 4, pos + 8));
      if (type === 'IEND') break;
      pos += 12 + len;
    }
    const out = new Uint8Array(png.length + chunk.length);
    out.set(png.subarray(0, pos), 0); out.set(chunk, pos); out.set(png.subarray(pos), pos + chunk.length);
    return out;
  }

  function readNoteData(png) {
    const sig = [137, 80, 78, 71, 13, 10, 26, 10];
    if (png.length < 8 || sig.some((b, i) => png[i] !== b)) return null;
    const dv = new DataView(png.buffer, png.byteOffset, png.byteLength);
    let pos = 8;
    while (pos + 12 <= png.length) {
      const len = dv.getUint32(pos), type = String.fromCharCode(...png.subarray(pos + 4, pos + 8));
      if (type === 'tEXt') {
        const body = png.subarray(pos + 8, pos + 8 + len);
        const z = body.indexOf(0);
        if (z > 0 && String.fromCharCode(...body.subarray(0, z)) === 'notedata') {
          let s = ''; for (let i = z + 1; i < body.length; i++) s += String.fromCharCode(body[i]);
          return JSON.parse(fromBase64(s));
        }
      }
      if (type === 'IEND') break;
      pos += 12 + len;
    }
    return null;
  }

  /* ---- Sanitizer for imported HTML ---- */
  function sanitize(html) {
    const doc = new DOMParser().parseFromString('<body>' + html, 'text/html');
    doc.querySelectorAll('script,style,iframe,object,embed,link,meta,form,base').forEach(n => n.remove());
    doc.body.querySelectorAll('*').forEach(el => {
      [...el.attributes].forEach(a => {
        const okMedia = a.name === 'src' && ((el.tagName === 'IMG' && /^data:image\/(png|jpe?g|gif|webp|avif|bmp);base64,/i.test(a.value)) || (el.tagName === 'AUDIO' && /^data:audio\/[\w.+-]+;base64,/i.test(a.value)));
        if (a.name.toLowerCase().startsWith('on') || (/^\s*(javascript|data):/i.test(a.value) && !okMedia)) el.removeAttribute(a.name);
      });
    });
    return doc.body.innerHTML;
  }

  /* ---- Export a single note as PNG ---- */
  function download(blob, filename) {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  const fileSafe = s => (s || 'note').replace(/[\\/:*?"<>|]+/g, '').trim().slice(0, 60) || 'note';

  function buildStage(n) {
    const stage = document.createElement('div');
    stage.className = 'stage';
    const title = document.createElement('div');
    title.className = 'x-title' + (n.title ? '' : ' empty');
    title.textContent = n.title || 'Untitled note';
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<span>Edited ${esc(fmtDate(n.updated))}</span><span>${esc(wordStats(plain(n.html)).label)}</span>`;
    const body = document.createElement('div');
    body.className = 'rich';
    body.innerHTML = n.html.replace(/\u200B/g, '');
    body.style.fontSize = (n.size || DEFAULT_SIZE) + 'px';
    body.querySelectorAll('figure.aud audio').forEach(a => a.remove());
    stage.append(title, meta, body);
    return stage;
  }

  async function exportPNG() {
    const n = current();
    if (!n) { toast('Open a note first'); return; }
    if (typeof window.html2canvas !== 'function') { toast('Image renderer failed to load. Check your connection.'); return; }
    toast('Rendering PNG…');
    const stage = buildStage(n);
    document.body.appendChild(stage);
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const canvas = await window.html2canvas(stage, {
        backgroundColor: '#0a0b0f', scale: 2, useCORS: true, logging: false, scrollX: 0, scrollY: 0,
        onclone: (doc, el) => { el.style.left = '0'; el.style.top = '0'; }
      });
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      const buf = new Uint8Array(await blob.arrayBuffer());
      const out = embedNoteData(buf, { app: 'notes', version: 1, title: n.title, html: n.html, size: n.size, readOnly: n.readOnly, created: n.created, updated: n.updated });
      download(new Blob([out], { type: 'image/png' }), fileSafe(n.title) + '.png');
      toast('Exported as PNG');
    } catch (err) {
      console.error(err);
      toast('Export failed');
    } finally {
      stage.remove();
    }
  }

  function exportBackup() {
    if (!notes.length) { toast('Nothing to back up'); return; }
    const payload = { app: 'notes', version: 1, exported: Date.now(), notes };
    download(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), 'notes-backup.json');
    toast(`Backed up ${notes.length} note${notes.length === 1 ? '' : 's'}`);
  }

  /* ---- Import ---- */
  function textToHtml(text) {
    const inline = inlineMd;
    let html = '', inList = false;
    text.replace(/\r/g, '').split('\n').forEach(line => {
      const li = line.match(/^\s*[-*•]\s+(.*)/), h = line.match(/^(#{1,3})\s+(.*)/);
      if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inline(li[1])}</li>`; return; }
      if (inList) { html += '</ul>'; inList = false; }
      if (h) html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
      else html += line.trim() ? `<p>${inline(line)}</p>` : '<p><br></p>';
    });
    if (inList) html += '</ul>';
    return html;
  }

  function addImported(d) {
    const n = {
      id: uid(),
      title: String(d.title || '').slice(0, 200),
      html: sanitize(String(d.html || '')),
      size: Number(d.size) || undefined,
      readOnly: !!d.readOnly,
      created: Number(d.created) || Date.now(),
      updated: Date.now()
    };
    notes.unshift(n);
    return n;
  }

  async function importFiles(files) {
    let added = 0, skipped = 0, media = 0, last = null;
    for (const f of files) {
      try {
        const name = f.name.toLowerCase();
        if (f.type === 'image/png' || name.endsWith('.png')) {
          const data = readNoteData(new Uint8Array(await f.arrayBuffer()));
          if (data && (data.html !== undefined || data.title !== undefined)) { last = addImported(data); added++; }
          else if (current() && !readOnly && await insertMedia(f)) media++; else skipped++;
        } else if (f.type.startsWith('image/') || f.type.startsWith('audio/') || /\.(mp3|m4a|wav|ogg|flac)$/.test(name)) {
          if (await insertMedia(f)) media++; else skipped++;
        } else if (name.endsWith('.json')) {
          const d = JSON.parse(await f.text());
          const arr = Array.isArray(d) ? d : (Array.isArray(d.notes) ? d.notes : [d]);
          let any = false;
          arr.forEach(x => { if (x && typeof x === 'object' && ('html' in x || 'title' in x)) { last = addImported(x); added++; any = true; } });
          if (!any) skipped++;
        } else {
          const t = await f.text();
          last = addImported({ title: f.name.replace(/\.[^.]+$/, ''), html: textToHtml(t) });
          added++;
        }
      } catch (err) { console.error(err); skipped++; }
    }
    if (added) {
      query = ''; $('#search').value = '';
      currentId = last.id; renderList(); openNote(currentId); scheduleSave();
    }
    if (media && !added) { if (!skipped) toast(`Added ${media} media file${media === 1 ? '' : 's'}`); return; }
    if (added && !skipped) toast(`Imported ${added} note${added === 1 ? '' : 's'}`);
    else if (added) toast(`Imported ${added}, skipped ${skipped} (no note data found)`);
    else toast('Nothing imported. PNGs must be exported from this app.');
  }

  $('#exportBtn').onclick = exportPNG;
  $('#backupBtn').onclick = exportBackup;
  $('#importBtn').onclick = () => $('#file').click();
  $('#file').onchange = e => { if (e.target.files.length) importFiles([...e.target.files]); e.target.value = ''; };

  // Drag & drop anywhere
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; document.body.classList.add('drag'); } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('drag'); });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('drag');
    if (e.dataTransfer.files.length) importFiles([...e.dataTransfer.files]);
  });

  load();
})();
</script>
</body>
